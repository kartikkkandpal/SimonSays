<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Simon Says Game</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <button id="theme-toggle" class="theme-toggle">🌙 Dark Mode</button>

  <h1 id="title">
    <span class="text-red">S</span>
    <span class="text-blue">I</span>
    <span class="text-yellow">M</span>
    <span class="text-green">O</span>
    <span class="text-red">N</span>
    <span class="text-blue">S</span>
    <span class="text-yellow">A</span>
    <span class="text-green">Y</span>
    <span class="text-red">S</span>
  </h1>

  <div class="circle-container">
    <div class="btn green" id="green"></div>
    <div class="btn red" id="red"></div>
    <div class="btn yellow" id="yellow"></div>
    <div class="btn blue" id="blue"></div>
    <div class="center-circle" id="center-circle">Start</div>
  </div>

  <audio id="click-sound" src="click.mp3"></audio>
  <audio id="wrong-sound" src="wrong.mp3"></audio>

  <script src="script.js"></script>
</body>
</html>
